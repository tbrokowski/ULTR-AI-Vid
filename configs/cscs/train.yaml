# General supervised training config.
# Dataset-specific paths and split settings are supplied by `train_job.sh`
# through `configs/cscs/dataset_*.yaml` plus optional Benin fold overrides.

experiment_name: "train"
experiment_dir: "./runs/train/default"
seed: 42
device: "cuda"

train: true
evaluate_best_valid_model: true

model_weights: null
best_model_path: null
resume_from_checkpoint: null
reset_optimizers: false

active_tasks:
  - "TB Label"

task_weights:
  "TB Label": 1.0
  "Pneumonia Label": 1.0
  "Covid Label": 1.0

task_pos_weights:
  "TB Label": 2.0
  "Pneumonia Label": 1.4
  "Covid Label": 6.0

use_pathology_loss: true
pathology_weight: 1.2
pathology_pos_weights: [1.0, 4.0, 15.0, 4.0]
legacy_hmv_mil_loss: true
pathology_aux_weight: 0.2
pathology_aux_pos_weights: [1.0, 4.0, 4.0, 4.0, 15.0]
legacy_hmv_mil_phase_updates: true
num_pathologies: 4
pathology_classes:
  - "A-line"
  - "Large Consolidations"
  - "Pleural Effusion"
  - "Other Pathology"

selection_strategy: "attention_pool"

patient_weight: 1.0
tb_weight: 1.0
correct_factor: 1.5
incorrect_factor: 3.0
reward_scale: 1.0
entropy_weight: 0.05
rl_clamp_neg: -3.0
rl_clamp_pos: 3.0
rl_accumulation_steps: 16

temperature: 0.9
temperature_min: 0.1
temperature_max: 3.0
temperature_decay: 0.995

rl_learning_rate: 0.00005
actor_lr: 0.0005
actor_weight_decay: 0.00001
critic_lr: 0.001
critic_weight_decay: 0.00001
gamma_rl: 0.99
gamma: 0.98
gae_lambda: 0.95
use_frame_history: true
frame_selector_max_norm: 0.5

root_dir: null
labels_csv: null
file_metadata_csv: null
split_csv: null
image_folder: "images"
video_folder: null

batch_size: 2
num_workers: 6
frame_sampling: 32
depth_filter: null

target_height: 224
target_width: 224
in_channels: 3

files_per_site: "all"
site_order: null
pad_missing_sites: true
max_sites: null
num_sites: 21
mode: "video"
pooling: "attention"

model_type: "attention_pool"
model_name: "hmv_mil_tb_classifier"

hidden_dim: 512
dropout_rate: 0.2
num_classes: 1
classification_type: "binary"

use_cross_site_attention: false
cross_site_num_heads: 8
use_site_positional_encoding: true

backbone: "clip"
freeze_backbone: false
pretrained: true
clip_unfreeze_last_n_layers: 12
local_weights_dir: "/users/lxflk/CLIP_weights/"

num_epochs: 200
accumulation_steps: 35
use_amp: true

learning_rate: 0.00002
weight_decay: 0.00001

backbone_lr: 0.000005
backbone_weight_decay: 0.00001
backbone_T_0: 4
backbone_T_mult: 2
backbone_eta_min: 0.0000005

pathology_lr: 0.00001
pathology_weight_decay: 0.00001
pathology_T_0: 4
pathology_T_mult: 2
pathology_eta_min: 0.0000005

patient_pipeline_lr: 0.000012
patient_pipeline_weight_decay: 0.00001
patient_pipeline_T_0: 4
patient_pipeline_T_mult: 2
patient_pipeline_eta_min: 0.0000005

integration_lr: 0.0001
integration_weight_decay: 0.00001

classifier_lr: 0.001
classifier_weight_decay: 0.00002

pos_weight: 2.0

eval_metric: "auc"
eval_metric_goal: "max"
early_stopping_patience: 50

log_dir: "./logs"
checkpoint_dir: "./checkpoints"

task: "TB Label"
