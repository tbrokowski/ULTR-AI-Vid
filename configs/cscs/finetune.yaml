# General finetuning config.
# Dataset-specific paths and split settings are supplied by
# `train_job_finetune.sh` through `configs/cscs/dataset_*.yaml`.

seed: 42
device: "cuda"

train: true
evaluate_best_valid_model: true

best_model_path: null
resume_from_checkpoint: null
reset_optimizers: true

active_tasks:
  - "TB Label"

task_weights:
  "TB Label": 1.0
  "Pneumonia Label": 1.0
  "Covid Label": 1.0

task_pos_weights:
  "TB Label": 4.0
  "Pneumonia Label": 1.4
  "Covid Label": 6.0

use_pathology_loss: true
pathology_weight: 0.2
pathology_pos_weights: [1.0, 4.0, 15.0, 1.8]
num_pathologies: 4
pathology_classes:
  - "A-line"
  - "Large Consolidations"
  - "Pleural Effusion"
  - "Other Pathology"

selection_strategy: "RL"

patient_weight: 1.0
tb_weight: 1.0
correct_factor: 1.5
incorrect_factor: 3.0
reward_scale: 1.0
entropy_weight: 0.05
rl_clamp_neg: -3.0
rl_clamp_pos: 3.0
rl_accumulation_steps: 16

temperature: 0.9
temperature_min: 0.1
temperature_max: 3.0
temperature_decay: 0.995

rl_learning_rate: 0.00005
actor_lr: 0.0005
actor_weight_decay: 0.00001
critic_lr: 0.001
critic_weight_decay: 0.00001
gamma_rl: 0.99
gamma: 0.98
gae_lambda: 0.95
use_frame_history: true
frame_selector_max_norm: 0.5

root_dir: null
labels_csv: null
file_metadata_csv: null
sa_clinical_data: null
split_csv: null
image_folder: "images"
video_folder: null

batch_size: 2
num_workers: 6
frame_sampling: 32
depth_filter: null

target_height: 224
target_width: 224
in_channels: 3

files_per_site: "all"
site_order: null
pad_missing_sites: true
max_sites: null
num_sites: 21
mode: "video"
pooling: "attention"

model_type: "tb_rl_mil"
model_name: "finetune"

hidden_dim: 512
dropout_rate: 0.3
num_classes: 1
classification_type: "binary"

use_cross_site_attention: false
cross_site_num_heads: 8
use_site_positional_encoding: true

backbone: "clip"
freeze_backbone: false
pretrained: true
clip_unfreeze_last_n_layers: 1
local_weights_dir: "/users/lxflk/CLIP_weights"

num_epochs: 20
accumulation_steps: 8
use_amp: true

learning_rate: 0.00001
weight_decay: 0.00001

backbone_lr: 0.00001
backbone_weight_decay: 0.00001
backbone_T_0: 4
backbone_T_mult: 2
backbone_eta_min: 0.000001

pathology_lr: 0.0001
pathology_weight_decay: 0.00001
pathology_T_0: 4
pathology_T_mult: 2
pathology_eta_min: 0.000001

patient_pipeline_lr: 0.0001
patient_pipeline_weight_decay: 0.00001
patient_pipeline_T_0: 4
patient_pipeline_T_mult: 2
patient_pipeline_eta_min: 0.000001

integration_lr: 0.0001
integration_weight_decay: 0.00001

classifier_lr: 0.001
classifier_weight_decay: 0.00002

pos_weight: 4.0

eval_metric: "auc"
eval_metric_goal: "max"
early_stopping_patience: 8

log_dir: "./logs"
checkpoint_dir: "./checkpoints/finetune"

task: "TB Label"

# Domain adaptation. The default is standard fine-tuning; pass
# `--domain-adaptation dann`, `--domain-adaptation fixmatch`, or
# `--domain-adaptation ewc` through
# `train_job_finetune.sh` to enable an adaptation trainer.
domain_adaptation: "none"

# DANN: source/target adversarial adaptation.
dann_lambda: 1.0
dann_lambda_schedule: true
dann_lambda_gamma: 10.0
dann_domain_loss_weight: 1.0
dann_source_task_weight: 1.0
dann_target_task_weight: 1.0
dann_use_source_task_loss: true
dann_use_target_task_loss: true
dann_learning_rate: 0.00005
dann_domain_lr: 0.0001
dann_weight_decay: 0.00001
dann_domain_weight_decay: 0.00001
dann_domain_hidden_dim: 256
dann_domain_dropout: 0.2
dann_gradient_clip_norm: 1.0
dann_accumulation_steps: 1
dann_log_every_steps: 10
dann_source_batch_size: null

# FixMatch: supervised target loss plus high-confidence target consistency.
fixmatch_confidence_threshold: 0.95
fixmatch_lambda_u: 1.0
fixmatch_unsup_warmup_epochs: 1
fixmatch_temperature: 1.0
fixmatch_unlabeled_batch_size: null
fixmatch_unlabeled_batch_ratio: 1.0
fixmatch_learning_rate: 0.00005
fixmatch_weight_decay: 0.00001
fixmatch_eta_min: 0.000001
fixmatch_gradient_clip_norm: 1.0
fixmatch_accumulation_steps: 1
fixmatch_log_every_steps: 10
fixmatch_weak_noise_std: 0.0
fixmatch_strong_flip_prob: 0.5
fixmatch_strong_intensity_jitter: 0.15
fixmatch_strong_noise_std: 0.05
fixmatch_strong_temporal_dropout_prob: 0.15
fixmatch_strong_cutout_prob: 0.5
fixmatch_strong_cutout_ratio: 0.25
fixmatch_aug_clip_min: -4.0
fixmatch_aug_clip_max: 4.0

# EWC: supervised target loss plus source-domain Fisher regularization.
ewc_lambda: 100.0
ewc_warmup_epochs: 0
ewc_fisher_max_batches: 0
ewc_fisher_use_amp: false
ewc_fisher_eps: 0.0
ewc_parameter_scope: "trainable"
ewc_include_keywords: []
ewc_exclude_keywords: []
ewc_normalize_penalty: false
ewc_source_batch_size: null
ewc_learning_rate: 0.00005
ewc_weight_decay: 0.00001
ewc_eta_min: 0.000001
ewc_gradient_clip_norm: 1.0
ewc_accumulation_steps: 1
ewc_log_every_steps: 10

subset_sizes: [1.0]
val_size: 0.2
split_random_state: 42
oversample_positive_class: true
positive_class_multiplier: 8
